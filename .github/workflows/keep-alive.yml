# Backup keep-awake for the free Render service.
# Main keep-awake is an uptime monitor (UptimeRobot / cron-job.org) every 5-10 minutes.
# GitHub may delay scheduled runs, so treat this as a safety net, not the only pinger.
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables -> New variable
#        Name: RENDER_URL   Value: https://your-app.onrender.com   (no trailing slash)
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.RENDER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 20 "${{ vars.RENDER_URL }}/healthz"
